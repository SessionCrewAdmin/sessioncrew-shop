<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SessionCrew – Produkte</title>
  <link rel="stylesheet" href="style.css" />
  <script src="cart.js" defer></script>
  <style>
    section.produkte {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2rem;
      justify-items: center;
      padding: 3rem 2rem;
    }

    .produkt {
      background-color: #111;
      padding: 2rem;
      border-radius: 16px;
      max-width: 360px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 0 0 transparent;
    }

    .produkt:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 30px rgba(255,255,255,0.05);
    }

    .produkt img {
      width: 100%;
      height: auto;
      object-fit: cover;
      border-radius: 8px;
    }

    .produkt h3 {
      margin-top: 1rem;
      font-size: 1.25rem;
      color: #f5f5f5;
      letter-spacing: 0.5px;
    }

    .produkt p {
      font-size: 0.95rem;
      color: #bbb;
      line-height: 1.6;
    }

    .produkt strong {
      font-size: 1.1rem;
      color: #fff;
    }

    #filter {
      margin-top: 2rem;
      margin-bottom: 2rem;
    }

    #filter button {
      margin: 0.3rem;
      padding: 0.6rem 1.2rem;
      background-color: #222;
      color: #ccc;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    #filter button:hover {
      background-color: #444;
      color: #fff;
    }

    @media (max-width: 900px) {
      section.produkte {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      section.produkte {
        grid-template-columns: 1fr;
        padding: 2rem 1rem;
      }

      .produkt {
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>SessionCrew</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="produkte.html">Shop</a>
      <a href="impressum.html">Impressum</a>
      <a href="#" onclick="toggleCart()">🛒</a>
    </nav>
  </header>

  <main>
    <h2 style="text-align:center; font-size:2rem; margin-top: 2rem;">Unsere Shirts</h2>

    <div id="filter" style="text-align:center;">
      <button onclick="filterProducts('all')">Alle</button>
      <button onclick="filterProducts('wolf')">Wolf</button>
      <button onclick="filterProducts('eule')">Eule</button>
      <button onclick="filterProducts('dämon')">Dämon</button>
      <button onclick="filterProducts('neon')">Neon</button>
      <button onclick="filterProducts('schwarz')">Schwarz</button>
      <button onclick="filterProducts('minimalistic')">Minimalistisch</button>
    </div>

    <section class="produkte" id="product-list">
      <!-- Produktkarten bleiben wie sie sind -->
      <!-- ... -->
    </section>
  </main>

  <footer>
    &copy; 2025 SessionCrew
  </footer>

  <script>
    function filterProducts(category) {
      const products = document.querySelectorAll('.produkt');
      products.forEach(p => {
        const cats = p.dataset.category.split(" ");
        const match = cats.includes(category) || category === 'all';
        p.style.display = match ? '' : 'none';
      });
    }
  </script>
</body>
</html>
